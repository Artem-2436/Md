<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Xcortex Face ID Scanner</title>
    <!-- Библиотека face-api -->
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <style>
        :root {
            --bg-dark: #1a1a1a;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --accent-color: #00d2ff;
            --success-color: #00ff88;
            --error-color: #ff4757;
            --text-light: #ffffff;
            --font-main: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-dark);
            color: var(--text-light);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- Главный экран --- */
        #home-screen {
            text-align: center;
            z-index: 10;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            background: linear-gradient(to right, #fff, var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: #aaa;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }

        .btn-start {
            background: linear-gradient(135deg, var(--accent-color), #007bff);
            border: none;
            color: white;
            padding: 18px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            touch-action: manipulation;
        }

        .btn-start:active {
            transform: scale(0.95);
        }

        /* --- Экран Сканирования (Полный экран) --- */
        #scan-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            display: none; /* Скрыт по умолчанию */
            flex-direction: column;
            z-index: 20;
        }

        .camera-wrapper {
            position: relative;
            flex-grow: 1;
            width: 100%;
            height: 60%; 
            overflow: hidden;
            background: #000;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            transform: scaleX(-1); /* Зеркалирование для фронтальной камеры */
        }

        canvas#overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; 
        }

        /* Панель управления снизу */
        .control-panel {
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-top: 1px solid var(--glass-border);
            min-height: 40%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Статус и Прогресс */
        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: #ccc;
        }

        .progress-container {
            width: 100%;
            height: 6px;
            background: #333;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 5px;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--accent-color);
            transition: width 0.1s linear;
        }

        /* Информационное поле */
        .analysis-info {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .info-title {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .info-value {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--text-light);
        }

        .info-subvalue {
            font-size: 0.9rem;
            color: #aaa;
            margin-top: 5px;
        }

        /* Кнопки действий */
        .actions-area {
            display: flex;
            gap: 10px;
        }

        .btn-action {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            touch-action: manipulation;
        }

        .btn-scan {
            background: var(--accent-color);
            color: black;
        }

        .btn-cancel {
            background: transparent;
            border: 1px solid #555;
            color: #aaa;
        }

        .btn-next {
            background: var(--success-color);
            color: black;
            display: none; 
        }

        /* Поле ввода возраста */
        .age-input-group {
            display: none; 
            flex-direction: column;
            gap: 10px;
        }

        input[type="number"] {
            background: #333;
            border: 1px solid #555;
            color: white;
            padding: 15px;
            border-radius: 10px;
            font-size: 1.2rem;
            text-align: center;
            outline: none;
        }

        input[type="number"]:focus {
            border-color: var(--accent-color);
        }

        /* --- Экран Результата --- */
        #result-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-dark);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 30;
            padding: 20px;
        }

        .code-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .final-code {
            font-family: 'Courier New', monospace;
            font-size: 3rem;
            font-weight: bold;
            color: var(--accent-color);
            margin: 20px 0;
            letter-spacing: 5px;
            word-break: break-all;
        }

        .badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .badge-male { background: #007bff; color: white; }
        .badge-female { background: #e91e63; color: white; }

        .btn-reset {
            margin-top: 30px;
            background: transparent;
            border: 1px solid #555;
            color: #aaa;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
        .loading-pulse {
            animation: pulse 1.5s infinite;
        }
    </style>
</head>
<body>

    <!-- 1. Главный экран -->
    <div id="home-screen">
        <h1>Xcortex AI</h1>
        <p class="subtitle">Система идентификации личности</p>
        <button class="btn-start" onclick="initApp()">НАЧАТЬ СКАНИРОВАНИЕ</button>
    </div>

    <!-- 2. Экран сканирования -->
    <div id="scan-screen">
        <div class="camera-wrapper">
            <video id="webcam" autoplay playsinline></video>
            <canvas id="overlay"></canvas>
        </div>
        
        <div class="control-panel">
            <div class="status-header">
                <span id="status-text">Готов к работе</span>
                <span id="percent-text">0%</span>
            </div>
            <div class="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>

            <!-- Область информации об анализе -->
            <div class="analysis-info" id="info-box">
                <div class="info-title">Ожидание действия...</div>
                <div class="info-value" id="main-result">--</div>
                <div class="info-subvalue" id="sub-result">Нажмите кнопку ниже</div>
            </div>

            <!-- Кнопки управления -->
            <div class="actions-area" id="controls-default">
                <button class="btn-action btn-cancel" onclick="cancelScan()">Отмена</button>
                <button class="btn-action btn-scan" id="btn-do-scan" onclick="performAnalysis()">СКАНИРОВАТЬ</button>
            </div>

            <!-- Форма ввода возраста -->
            <div class="age-input-group" id="form-age">
                <label style="color:#aaa; font-size:0.9rem;">Подтвердите ваш возраст:</label>
                <input type="number" id="user-age-input" placeholder="Возраст (лет)" min="5" max="99">
                <div class="actions-area">
                    <button class="btn-action btn-cancel" onclick="resetForm()">Назад</button>
                    <button class="btn-action btn-next" onclick="generateFinalCode()" style="display:block; background:var(--success-color)">ПОДТВЕРДИТЬ</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 3. Экран результата -->
    <div id="result-screen">
        <div class="code-card">
            <h2 style="margin-bottom:10px;">ID Создан</h2>
            <span id="res-badge" class="badge">-</span>
            <div class="final-code" id="res-code">000000</div>
            <p style="color:#888; font-size:0.9rem;">Сохраните этот код.</p>
            <button class="btn-reset" onclick="location.reload()">Новое сканирование</button>
        </div>
    </div>

    <script>
        // Глобальные переменные состояния
let stream = null;
let modelsLoaded = false;
let detectedData = null; 
let animationFrameId = null; // ID цикла анимации
let currentTask = ''; // Текущее задание ('tilt_left', 'tilt_right')
let taskStartTime = 0; // Время начала попытки
const TASK_DURATION_MS = 5000; // Даем пользователю 5 секунд на выполнение

const MODEL_URL = 'https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights';

// DOM Elements
const homeScreen = document.getElementById('home-screen');
const scanScreen = document.getElementById('scan-screen');
const resultScreen = document.getElementById('result-screen');
const videoEl = document.getElementById('webcam');
const overlayCanvas = document.getElementById('overlay');
const ctx = overlayCanvas.getContext('2d');

const statusBar = document.getElementById('progress-bar');
const statusText = document.getElementById('status-text');
const percentText = document.getElementById('percent-text');

const infoTitle = document.querySelector('.info-title');
const mainResult = document.getElementById('main-result');
const subResult = document.getElementById('sub-result');

const controlsDefault = document.getElementById('controls-default');
const formAge = document.getElementById('form-age');
const ageInput = document.getElementById('user-age-input');
const btnDoScan = document.getElementById('btn-do-scan');

// --- Инициализация ---
async function initApp() {
    homeScreen.style.display = 'none';
    scanScreen.style.display = 'flex';
    
    setStatus("Загрузка нейросети...", 0);
    
    try {
        await loadModels();
        await openCameraSafe();
        resizeOverlay();
        window.addEventListener('resize', resizeOverlay);
        
        setStatus("Готово. Нажмите СКАНИРОВАТЬ", 100);
        
    } catch (err) {
        console.error(err);
        alert("Ошибка запуска: " + err.message);
        cancelScan();
    }
}

async function loadModels() {
    if (modelsLoaded) return;
    
    updateProgress(10, "Загрузка TinyFaceDetector...");
    await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
    
    updateProgress(30, "Загрузка Landmarks...");
    await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
    
    updateProgress(60, "Загрузка Age/Gender...");
    await faceapi.nets.ageGenderNet.loadFromUri(MODEL_URL);
    
    modelsLoaded = true;
    updateProgress(100, "Модели загружены");
}

async function openCameraSafe() {
    try {
        setStatus("Запрос доступа к камере...", 50);
        stream = await navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } }, 
            audio: false 
        });
        videoEl.srcObject = stream;
        
        try {
            await videoEl.play();
        } catch (playErr) {
            setTimeout(() => videoEl.play(), 500);
        }

        return new Promise((resolve, reject) => {
            let timeoutId = setTimeout(() => {
                clearTimeout(timeoutId);
                reject(new Error("Таймаут ожидания видеопотока"));
            }, 5000);
            
            videoEl.onplaying = () => {
                clearTimeout(timeoutId);
                resolve();
            };
            videoEl.onloadeddata = () => {
                 if(videoEl.readyState >= 2) {
                     clearTimeout(timeoutId);
                     resolve();
                 }
            };
        });

    } catch (err) {
        throw new Error("Нет доступа к камере: " + err.name);
    }
}

function resizeOverlay() {
    if (videoEl.videoWidth > 0 && videoEl.videoHeight > 0) {
        overlayCanvas.width = videoEl.videoWidth;
        overlayCanvas.height = videoEl.videoHeight;
    } else {
        setTimeout(resizeOverlay, 100);
    }
}

// --- ЛОГИКА АКТИВНОЙ ПРОВЕРКИ (LIVENESS) ---

async function performAnalysis() {
    if (!stream || videoEl.readyState < 2) {
         alert("Камера еще не готова.");
         return;
    }

    btnDoScan.disabled = true;
    btnDoScan.innerText = "Проверка...";
    controlsDefault.style.opacity = "0.5";
    
    // Выбираем случайное задание
    const tasks = ['tilt_left', 'tilt_right'];
    currentTask = tasks[Math.floor(Math.random() * tasks.length)];
    taskStartTime = Date.now();
    
    setStatus(`Выполните действие: ${currentTask === 'tilt_left' ? 'НАКЛОНИТЕ ГОЛОВУ ВЛЕВО' : 'НАКЛОНИТЕ ГОЛОВУ ВПРАВО'}`, 0);
    clearOverlay();
    
    // Запускаем цикл реального времени
    startRealTimeLoop();
}

function startRealTimeLoop() {
    // Отменяем предыдущий цикл, если был
    if (animationFrameId) cancelAnimationFrame(animationFrameId);
    
    loop();
}

async function loop() {
    // Проверка таймаута задания
    const elapsed = Date.now() - taskStartTime;
    if (elapsed > TASK_DURATION_MS) {
        stopLoop();
        showError("Время вышло! Попробуйте снова.");
        return;
    }

    // Обновляем прогресс-бар визуально (остаток времени)
    const remainingPercent = Math.max(0, 100 - (elapsed / TASK_DURATION_MS * 100));
    setStatus(`Выполняйте действие... Осталось ${(TASK_DURATION_MS - elapsed)/1000}s`, remainingPercent);

    try {
        const options = new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.5 });
        
        // Детектируем лицо и маркеры в каждом кадре
        const detection = await faceapi.detectSingleFace(videoEl, options)
            .withFaceLandmarks();

        if (!detection) {
            clearOverlay();
            animationFrameId = requestAnimationFrame(loop);
            return;
        }

        // Рисуем рамку и маркеры
        drawLiveDetection(detection);

        // Проверяем, выполнено ли условие наклона
        const isCompleted = checkHeadTilt(detection.landmarks, currentTask);
        
        if (isCompleted) {
            stopLoop();
            finalizeSuccess(detection);
        } else {
            // Продолжаем цикл
            animationFrameId = requestAnimationFrame(loop);
        }

    } catch (err) {
        console.error(err);
        stopLoop();
        showError("Ошибка анализа кадра.");
    }
}

function stopLoop() {
    if (animationFrameId) {
        cancelAnimationFrame(animationFrameId);
        animationFrameId = null;
    }
}

// Математика проверки наклона головы
function checkHeadTilt(landmarks, taskType) {
    // Получаем координаты левого и правого глаза (индексы 36-41 и 42-47 обычно, но берем центральные точки)
    // FaceLandmarks68 structure:
    // Left Eye: indices 36-41. Right Eye: indices 42-47.
    // Let's take the outer corners or centers for stability.
    // Using points[39] (center left eye) and points[45] (center right eye) roughly.
    // Actually, safer to use average of eye points or specific stable points like inner corners.
    // Points 39 and 45 are often used as approximate centers.
    
    const leftEye = landmarks.getLeftEye()[3]; // Approx center
    const rightEye = landmarks.getRightEye()[3]; // Approx center
    
    if (!leftEye || !rightEye) return false;

    // Calculate angle between eyes relative to horizontal
    // dx = x2 - x1, dy = y2 - y1
    const dx = rightEye._x - leftEye._x;
    const dy = rightEye._y - leftEye._y;
    
    // Angle in radians
    const angleRad = Math.atan2(dy, dx);
    // Convert to degrees
    const angleDeg = angleRad * (180 / Math.PI);

    // Logic:
    // If head tilts RIGHT (clockwise): Left eye goes UP (smaller Y), Right eye goes DOWN (larger Y).
    // Wait, coordinate system: (0,0) is top-left.
    // Tilt Right: Left side of face moves up (Y decreases), Right side moves down (Y increases).
    // So dy will be positive (RightY > LeftY). Angle will be positive.
    
    // Tilt Left: Left side moves down (Y increases), Right side moves up (Y decreases).
    // So dy will be negative (RightY < LeftY). Angle will be negative.

    const threshold = 15; // Degrees tolerance
    
    if (taskType === 'tilt_right') {
        // Expecting positive angle (Left High, Right Low)
        return angleDeg > threshold;
    } else if (taskType === 'tilt_left') {
        // Expecting negative angle (Left Low, Right High)
        return angleDeg < -threshold;
    }
    
    return false;
}

function drawLiveDetection(detection) {
    clearOverlay();
    
    const box = detection.detection.box;
    const landmarks = detection.landmarks.positions;
    
    // Draw Box
    ctx.strokeStyle = '#00d2ff';
    ctx.lineWidth = 2;
    ctx.strokeRect(box.x, box.y, box.width, box.height);
    
    // Draw Eyes specifically to show what we are tracking
    const leftEyePts = landmarks.slice(36, 42);
    const rightEyePts = landmarks.slice(42, 48);
    
    ctx.fillStyle = '#ff4757';
    [...leftEyePts, ...rightEyePts].forEach(pt => {
        ctx.beginPath();
        ctx.arc(pt._x, pt._y, 3, 0, 2 * Math.PI);
        ctx.fill();
    });
    
    // Visual feedback text on canvas
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 20px Segoe UI';
    const hintText = currentTask === 'tilt_left' ? "⬅️ НАКЛОН ВЛЕВО" : "➡️ НАКЛОН ВПРАВО";
    ctx.fillText(hintText, box.x, box.y - 10);
}

async function finalizeSuccess(detectionBasic) {
    setStatus("Действие выполнено! Финальный анализ...", 100);
    
    // Теперь делаем полный анализ с возрастом и полом на последнем удачном кадре
    // Но так как мы уже имели detection, можно просто добавить Age/Gender net к текущему результату
    // Однако face-api требует повторного прогона для разных сетей иногда.
    // Безопаснее взять свежий кадр, но быстро.
    
    const fullDetections = await faceapi.detectSingleFace(videoEl, new faceapi.TinyFaceDetectorOptions())
        .withFaceLandmarks()
        .withAgeAndGender();

    if (!fullDetections) {
        showError("Не удалось получить финальные данные.");
        return;
    }

    detectedData = {
        gender: fullDetections.gender,
        age: Math.round(fullDetections.age),
        confidence: fullDetections.genderProbability,
        box: fullDetections.detection.box,
        landmarks: fullDetections.landmarks
    };

    drawDetection(detectedData); // Final static draw
    showAnalysisResults(detectedData);
    
    btnDoScan.disabled = false;
    btnDoScan.innerText = "СКАНИРОВАТЬ";
    controlsDefault.style.opacity = "1";
}

// --- СТАРЫЕ ФУНКЦИИ (Без изменений, кроме показа результатов) ---

function showAnalysisResults(data) {
    controlsDefault.style.display = 'none';
    formAge.style.display = 'flex';
    
    const genderLabel = data.gender === 'male' ? 'Мужской пол' : 'Женский пол';
    const icon = data.gender === 'male' ? '👨' : '👩';
    
    infoTitle.innerText = "Результат распознавания";
    mainResult.innerHTML = `${icon} ${genderLabel}`;
    subResult.innerText = `Предполагаемый возраст ИИ: ~${data.age} лет`;
    
    setTimeout(() => ageInput.focus(), 100);
}

function resetForm() {
    formAge.style.display = 'none';
    controlsDefault.style.display = 'flex';
    clearOverlay();
    detectedData = null;
    infoTitle.innerText = "Ожидание действия...";
    mainResult.innerText = "--";
    subResult.innerText = "Нажмите кнопку ниже";
    setStatus("Готово", 100);
}

function generateFinalCode() {
    const ageVal = parseInt(ageInput.value);
    
    if (!detectedData) {
        alert("Сначала выполните сканирование.");
        return;
    }
    
    if (isNaN(ageVal) || ageVal < 0 || ageVal > 120) {
        alert("Введите корректный возраст (0-120).");
        return;
    }

    let prefixPart = '';
    if (detectedData.gender === 'male') {
        prefixPart = Math.floor(Math.random() * 50) + 50;
    } else {
        prefixPart = Math.floor(Math.random() * 50); 
    }
    
    const part1 = prefixPart.toString().padStart(2, '0');
    const part2 = Math.floor(Math.random() * 100).toString().padStart(2, '0');
    const part3 = ageVal.toString().padStart(2, '0');
    
    const finalCode = part1 + part2 + part3;
    
    finishProcess(finalCode, detectedData.gender, ageVal);
}

function finishProcess(code, gender, age) {
    if (stream) {
        stream.getTracks().forEach(track => track.stop());
    }
    
    scanScreen.style.display = 'none';
    resultScreen.style.display = 'flex';
    
    document.getElementById('res-code').innerText = code;
    
    const badge = document.getElementById('res-badge');
    if (gender === 'male') {
        badge.className = 'badge badge-male';
        badge.innerText = 'MALE / МАЛЬЧИК';
    } else {
        badge.className = 'badge badge-female';
        badge.innerText = 'FEMALE / ДЕВОЧКА';
    }
}

function setStatus(text, percent) {
    statusText.innerText = text;
    percentText.innerText = Math.round(percent) + "%";
    statusBar.style.width = percent + "%";
}

function updateProgress(percent, message) {
    setStatus(message, percent);
    return new Promise(resolve => setTimeout(resolve, 50)); 
}

function showError(msg) {
    stopLoop(); // Важно остановить цикл при ошибке
    infoTitle.innerText = "ОШИБКА";
    mainResult.innerText = "❌";
    subResult.innerText = msg;
    subResult.style.color = "var(--error-color)";
    
    btnDoScan.disabled = false;
    btnDoScan.innerText = "СКАНИРОВАТЬ";
    controlsDefault.style.opacity = "1";
    
    setTimeout(resetForm, 3000);
}

function cancelScan() {
    stopLoop();
    if (stream) {
        stream.getTracks().forEach(track => track.stop());
    }
    scanScreen.style.display = 'none';
    homeScreen.style.display = 'block';
    location.reload();
}

function clearOverlay() {
    ctx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
}

function drawDetection(data) {
    clearOverlay();
    if (!data || !data.box) return;

    const dBox = data.box; 
    
    ctx.strokeStyle = '#00ff88';
    ctx.lineWidth = 3;
    ctx.strokeRect(dBox.x, dBox.y, dBox.width, dBox.height);
    
    ctx.fillStyle = '#00ff88';
    ctx.font = 'bold 16px Segoe UI';
    const label = `${data.gender === 'male' ? 'M' : 'F'} | ${Math.round(data.age)}y`;
    ctx.fillText(label, dBox.x, dBox.y - 10);
    
    if (data.landmarks && data.landmarks.positions) {
        const points = data.landmarks.positions.map(p => ({x: p._x, y: p._y}));
        ctx.fillStyle = '#00d2ff';
        points.forEach(pt => {
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, 2, 0, 2 * Math.PI);
            ctx.fill();
        });
    }
                }
    </script>
