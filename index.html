<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face ID Generator</title>
    <!-- Подключаем face-api.js -->
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --glass-bg: rgba(255, 255, 255, 0.25);
            --glass-border: rgba(255, 255, 255, 0.18);
            --text-color: #333;
            --primary-btn: #007bff;
            --success-green: #28a745;
            --danger-red: #dc3545;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-color);
        }

        /* Контейнер приложения */
        .app-container {
            width: 90%;
            max-width: 500px;
            text-align: center;
        }

        /* Главный экран */
        #main-screen {
            transition: opacity 0.3s ease;
        }

        .big-start-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 50px;
            padding: 20px 60px;
            font-size: 24px;
            color: white;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .big-start-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(102, 126, 234, 0.6);
        }

        .big-start-btn:active {
            transform: translateY(1px);
        }

        /* Модальное окно / Экран сканирования */
        #scan-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .card-glass {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            width: 90%;
            max-width: 400px;
            backdrop-filter: blur(4px);
        }

        video {
            width: 100%;
            border-radius: 10px;
            background: #000;
            margin-bottom: 15px;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
        }

        .status-text {
            font-size: 18px;
            margin-bottom: 20px;
            color: #fff;
            min-height: 24px;
        }

        input[type="number"] {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            border: none;
            background: rgba(255, 255, 255, 0.9);
            font-size: 18px;
            margin-bottom: 15px;
            outline: none;
            text-align: center;
        }

        .action-btn {
            background: #fff;
            color: #333;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            width: 100%;
            margin-top: 10px;
        }

        .action-btn:hover {
            background: #eee;
            transform: scale(1.02);
        }

        /* Результат */
        #result-screen {
            display: none;
            margin-top: 20px;
        }

        .code-display {
            font-family: 'Courier New', Courier, monospace;
            font-size: 48px;
            font-weight: bold;
            color: #333;
            background: #fff;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            letter-spacing: 5px;
            margin: 20px 0;
            word-break: break-all;
        }

        .info-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 14px;
            margin-right: 5px;
            color: white;
        }
        .badge-boy { background-color: var(--primary-btn); }
        .badge-girl { background-color: var(--danger-red); }

        .reset-link {
            color: #666;
            text-decoration: underline;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
            display: block;
        }

        /* Анимация появления */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in {
            animation: fadeIn 0.5s ease forwards;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Главный экран -->
        <div id="main-screen">
            <h1 style="margin-bottom: 30px;">Asinhrom Face ID</h1>
            <button class="big-start-btn" onclick="startProcess()">НАЧАТЬ</button>
        </div>

        <!-- Результаты -->
        <div id="result-screen">
            <h2>Генерирован код:</h2>
            <div class="code-display" id="generated-code">------</div>
            <p>Тип пользователя: 
                <span id="type-label" class="info-badge"></span>
                Возраст: <strong id="age-label"></strong>
            </p>
            <button class="action-btn" onclick="location.reload()">Новое сканирование</button>
        </div>
    </div>

    <!-- Экран сканирования (Оверлей) -->
    <div id="scan-screen">
        <div class="card-glass fade-in">
            <video id="webcam" autoplay playsinline></video>
            <canvas id="overlay"></canvas>
            
            <div class="status-text" id="status-msg">Загрузка моделей ИИ...</div>
            
            <!-- Шаги внутри карточки -->
            <div id="step-camera" style="display:none;">
                <p>Наведите лицо на камеру.</p>
                <button class="action-btn" onclick="captureAndAnalyze()">СКАНИРОВАТЬ ЛИЦО</button>
            </div>

            <div id="step-age" style="display:none;">
                <p id="detected-info">Лицо найдено!</p>
                <label for="user-age">Сколько вам лет?</label>
                <input type="number" id="user-age" placeholder="Например: 14" min="5" max="99">
                <button class="action-btn" onclick="generateCode()">ДАЛЕЕ</button>
            </div>
        </div>
    </div>

    <script>
        let modelsLoaded = false;
let stream = null;
const video = document.getElementById('webcam');
const statusMsg = document.getElementById('status-msg');
const stepCamera = document.getElementById('step-camera');
const stepAge = document.getElementById('step-age');
const detectedInfo = document.getElementById('detected-info');
const userAgeInput = document.getElementById('user-age');

// Пути к моделям (используем CDN для простоты)
const MODEL_URL = 'https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights';

async function startProcess() {
    document.getElementById('main-screen').style.display = 'none';
    const scanScreen = document.getElementById('scan-screen');
    scanScreen.style.display = 'flex';
    
    try {
        if (!modelsLoaded) {
            statusMsg.innerText = "Загрузка нейросети...";
            await Promise.all([
                faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
                faceapi.nets.faceExpressionNet.loadFromUri(MODEL_URL),
                faceapi.nets.ageGenderNet.loadFromUri(MODEL_URL) // Модель определения возраста и пола
            ]);
            modelsLoaded = true;
        }
        
        statusMsg.innerText = "Открытие доступа к камере...";
        stream = await navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: 'user' }, // Фронтальная камера
            audio: false 
        });
        video.srcObject = stream;
        
        // Ждем загрузки видео
        video.onloadedmetadata = () => {
            statusMsg.innerText = "";
            stepCamera.style.display = 'block';
        };

    } catch (err) {
        console.error(err);
        statusMsg.innerText = "Ошибка доступа к камере или загрузки моделей.";
        alert("Проверьте разрешения камеры в браузере.");
    }
}

async function captureAndAnalyze() {
    statusMsg.innerText = "Анализ лица...";
    stepCamera.style.display = 'none';
    
    try {
        // Определяем пол и возраст
        const detections = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
            .withFaceLandmarks()
            .withAgeAndGender();

        if (!detections) {
            alert("Лицо не найдено. Попробуйте снова при хорошем освещении.");
            stepCamera.style.display = 'block';
            return;
        }

        const gender = detections.gender === 'male' ? 'Мальчик' : 'Девочка';
        const predictedAge = Math.round(detections.age);
        
        detectedInfo.innerHTML = `Распознан: <strong>${gender}</strong><br>(Предполагаемый возраст ИИ: ${predictedAge})`;
        
        stepAge.style.display = 'block';
        userAgeInput.focus();
        
    } catch (err) {
        console.error(err);
        alert("Ошибка анализа.");
        stepCamera.style.display = 'block';
    }
}

function generateCode() {
    const ageStr = userAgeInput.value.trim();
    
    if (!ageStr || isNaN(ageStr)) {
        alert("Пожалуйста, введите корректный возраст цифрами.");
        return;
    }
    
    let ageNum = parseInt(ageStr);
    if (ageNum < 0 || ageNum > 99) {
         alert("Возраст должен быть от 0 до 99.");
         return;
    }

    // Получаем пол из текста выше (так как он был определен в captureAndAnalyze)
    // В реальном проекте лучше хранить переменную глобально, но здесь парсим для примера
    // Лучше было бы сохранить результат в переменную let currentGender inside scope.
    // Исправляем: сохраним данные в глобальные переменные перед вызовом generateCode
    
    // Так как у нас нет прямой передачи параметра в generateCode(), 
    // давайте немного изменим логику хранения данных.
    // Я добавлю скрытые данные или просто использую текст элемента.
    
    const infoText = detectedInfo.innerText;
    let isBoy = infoText.includes("Мальчик");
    
    // Формируем первую часть кода (2 цифры)
    let prefix = '';
    if (isBoy) {
        // Мальчик: число >= 50. Возьмем случайное от 50 до 99
        prefix = Math.floor(Math.random() * 50) + 50;
    } else {
        // Девочка: число < 50. Возьмем случайное от 10 до 49
        prefix = Math.floor(Math.random() * 40) + 10;
    }
    
    // Вторая часть (2 цифры): Рандом от 00 до 99
    let middle = Math.floor(Math.random() * 100);
    middle = middle.toString().padStart(2, '0');
    
    // Третья часть (2 цифры): Возраст
    let suffix = ageNum.toString().padStart(2, '0');
    
    const finalCode = `${prefix}${middle}${suffix}`;
    
    showResult(finalCode, isBoy, ageNum);
}

function showResult(code, isBoy, age) {
    // Закрываем оверлей камеры
    document.getElementById('scan-screen').style.display = 'none';
    
    // Останавливаем камеру
    if (stream) {
        stream.getTracks().forEach(track => track.stop());
    }
    
    // Показываем результат
    const resultScreen = document.getElementById('result-screen');
    resultScreen.style.display = 'block';
    resultScreen.classList.add('fade-in');
    
    document.getElementById('generated-code').innerText = code;
    
    const label = document.getElementById('type-label');
    label.className = 'info-badge ' + (isBoy ? 'badge-boy' : 'badge-girl');
    label.innerText = isBoy ? 'МАЛЬЧИК' : 'ДЕВОЧКА';
    
    document.getElementById('age-label').innerText = age + ' лет';
        }
    </script>
</body>
</html>
